name: Typst Build

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    name: Typst Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main

      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.15.1'

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk fonts-dejavu-core

      - name: Build PDFs
        run: |
          mkdir -p output
          typst compile --root . typst/数学分析/main.typ output/calculus.pdf
          typst compile --root . typst/高等代数/main.typ output/linear-algebra.pdf
          typst compile --root . typst/抽象代数/main.typ output/abstract-algebra.pdf
          typst compile --root . typst/考研背诵手册/main.typ output/kaoyan.pdf

      - name: Convert PDFs to HTML
        working-directory: output
        run: |
          shopt -s expand_aliases
          alias pdf2htmlEX='docker run --rm -v `pwd`:/pdf bwits/pdf2htmlex pdf2htmlEX'
          pdf2htmlEX ./calculus.pdf
          pdf2htmlEX ./linear-algebra.pdf
          pdf2htmlEX ./abstract-algebra.pdf
          pdf2htmlEX ./kaoyan.pdf

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force_orphan: true
          enable_jekyll: true
          publish_dir: ./output
