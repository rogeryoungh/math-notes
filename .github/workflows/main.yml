name: Typst Build

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    name: Typst Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Set up Typst
        uses: typst-community/setup-typst@v5.3.0
        with:
          typst-version: '0.15.1'

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk fonts-dejavu-core

      - name: Build PDFs
        run: |
          mkdir -p output
          typst compile --root . typst/数学分析/main.typ output/calculus.pdf
          typst compile --root . typst/高等代数/main.typ output/linear-algebra.pdf
          typst compile --root . typst/抽象代数/main.typ output/abstract-algebra.pdf
          typst compile --root . typst/考研背诵手册/main.typ output/kaoyan.pdf

      - name: Build HTML
        run: |
          typst compile --root . --features html typst/数学分析/main.typ output/calculus.html
          typst compile --root . --features html typst/高等代数/main.typ output/linear-algebra.html
          typst compile --root . --features html typst/抽象代数/main.typ output/abstract-algebra.html
          typst compile --root . --features html typst/考研背诵手册/main.typ output/kaoyan.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force_orphan: true
          enable_jekyll: true
          publish_dir: ./output
